# =====================================================================
# SATURN SITE CONTROLS - HOME ASSISTANT PACKAGE: DEPOT (depot HA)
# No PLC at the depot: HA talks straight to the Schneider TM3 coupler.
# Hardware: TM3BCEIP coupler + TM3DI8 + TM3DQ8R (or DI16 / DQ16R).
#
#   DI0 roller door 1 closed     DQ0 yard lights 1
#   DI1 roller door 2 closed     DQ1 yard lights 2
#   DI2 gate closed              DQ2 yard lights 3
#   DI3 alarm armed (panel o/p)  DQ3 office A/C enable
#   DI4 yard motion (PIR o/p)    DQ4-7 spare
#
# !! The two register addresses marked CONFIRM come from the coupler's
# !! register map. Send Claude a screenshot and they'll be set.
#
# Set the coupler's comms-loss fallback: DQ0-2 (yard lights) ON,
# DQ3 (A/C) OFF. HA rewrites the outputs every 20 s, which also acts
# as the coupler's keep-alive.
#
# Install: save as /config/packages/depot.yaml on the DEPOT Home Assistant
# (configuration.yaml needs: homeassistant: packages: !include_dir_named packages)
# Replace notify.notify with the phones that should get depot alerts.
# =====================================================================

modbus:
  - name: depot_io
    type: tcp
    host: 10.20.10.20            # depot TM3 coupler
    port: 502
    timeout: 5
    sensors:
      - name: Depot IO inputs
        unique_id: depot_io_inputs
        slave: 1
        address: 0               # CONFIRM: register holding the DI module's input word
        input_type: input        # CONFIRM: input or holding
        data_type: uint16
        scan_interval: 2

# ---------------------------------------------------------------------
# Inputs (decoded from the input word)
# ---------------------------------------------------------------------
template:
  - binary_sensor:
      - name: Depot roller door 1
        unique_id: depot_roller_door_1
        device_class: garage_door          # on = open
        state: "{{ (states('sensor.depot_io_inputs') | int(0) // 1) % 2 == 0 }}"
        availability: "{{ has_value('sensor.depot_io_inputs') }}"
      - name: Depot roller door 2
        unique_id: depot_roller_door_2
        device_class: garage_door
        state: "{{ (states('sensor.depot_io_inputs') | int(0) // 2) % 2 == 0 }}"
        availability: "{{ has_value('sensor.depot_io_inputs') }}"
      - name: Depot gate
        unique_id: depot_gate
        device_class: opening
        state: "{{ (states('sensor.depot_io_inputs') | int(0) // 4) % 2 == 0 }}"
        availability: "{{ has_value('sensor.depot_io_inputs') }}"
      - name: Depot alarm disarmed
        unique_id: depot_alarm_disarmed
        device_class: safety
        state: "{{ (states('sensor.depot_io_inputs') | int(0) // 8) % 2 == 0 }}"   # on = disarmed
        availability: "{{ has_value('sensor.depot_io_inputs') }}"
      - name: Depot yard motion
        unique_id: depot_yard_motion
        device_class: motion
        state: "{{ (states('sensor.depot_io_inputs') | int(0) // 16) % 2 == 1 }}"
        availability: "{{ has_value('sensor.depot_io_inputs') }}"
      - name: Depot IO online
        unique_id: depot_io_online
        device_class: connectivity
        state: "{{ has_value('sensor.depot_io_inputs') }}"

# ---------------------------------------------------------------------
# Outputs: switch these from the dashboard; the automation below packs
# them into one word and writes it to the coupler.
# ---------------------------------------------------------------------
input_boolean:
  depot_yard_lights_1:
    name: Yard lights 1
    icon: mdi:light-flood-down
  depot_yard_lights_2:
    name: Yard lights 2
    icon: mdi:light-flood-down
  depot_yard_lights_3:
    name: Yard lights 3
    icon: mdi:light-flood-down
  depot_office_ac:
    name: Office A/C enabled
    icon: mdi:air-conditioner
  depot_security_mode:
    name: Yard security lighting (motion after hours)
    icon: mdi:shield-home

schedule:
  depot_open_hours:
    name: Depot open hours
    monday:    [{ from: "06:00:00", to: "17:30:00" }]
    tuesday:   [{ from: "06:00:00", to: "17:30:00" }]
    wednesday: [{ from: "06:00:00", to: "17:30:00" }]
    thursday:  [{ from: "06:00:00", to: "17:30:00" }]
    friday:    [{ from: "06:00:00", to: "17:30:00" }]

automation:
  - id: depot_io_write_outputs
    alias: Depot IO - write outputs (DQ0-DQ3)
    mode: queued
    max: 3
    triggers:
      - trigger: time_pattern
        seconds: "/20"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_boolean.depot_yard_lights_1
          - input_boolean.depot_yard_lights_2
          - input_boolean.depot_yard_lights_3
          - input_boolean.depot_office_ac
    actions:
      - action: modbus.write_register
        data:
          hub: depot_io
          slave: 1
          address: 0             # CONFIRM: register for the DQ module's output word
          value: >
            {{ (1 if is_state('input_boolean.depot_yard_lights_1', 'on') else 0)
             + (2 if is_state('input_boolean.depot_yard_lights_2', 'on') else 0)
             + (4 if is_state('input_boolean.depot_yard_lights_3', 'on') else 0)
             + (8 if is_state('input_boolean.depot_office_ac', 'on') else 0) }}

  - id: depot_yard_lights_sunset
    alias: Depot - yard lights on at sunset
    triggers:
      - trigger: sun
        event: sunset
        offset: "-00:15:00"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.depot_yard_lights_1
            - input_boolean.depot_yard_lights_2
            - input_boolean.depot_yard_lights_3

  - id: depot_yard_lights_late_off
    alias: Depot - yard lights to security mode at 10 pm
    triggers:
      - trigger: time
        at: "22:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.depot_yard_lights_2
            - input_boolean.depot_yard_lights_3
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.depot_security_mode

  - id: depot_yard_lights_sunrise_off
    alias: Depot - yard lights off at sunrise
    triggers:
      - trigger: sun
        event: sunrise
        offset: "00:15:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.depot_yard_lights_1
            - input_boolean.depot_yard_lights_2
            - input_boolean.depot_yard_lights_3
            - input_boolean.depot_security_mode

  - id: depot_motion_lights
    alias: Depot - motion after hours, all yard lights on for 10 min
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.depot_yard_motion
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.depot_security_mode
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.depot_yard_lights_2
            - input_boolean.depot_yard_lights_3
      - action: notify.notify
        data:
          title: Depot yard motion
          message: Motion in the yard after hours. Yard lights on.
      - delay: "00:10:00"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.depot_yard_lights_2
            - input_boolean.depot_yard_lights_3

  - id: depot_ac_off_after_hours
    alias: Depot - office A/C off when closed
    triggers:
      - trigger: state
        entity_id: schedule.depot_open_hours
        to: "off"
        for: "00:15:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.depot_office_ac

  - id: depot_open_after_hours_alert
    alias: Depot - door or gate open after hours
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.depot_roller_door_1
          - binary_sensor.depot_roller_door_2
          - binary_sensor.depot_gate
        to: "on"
        for: "00:05:00"
      - trigger: state
        entity_id: schedule.depot_open_hours
        to: "off"
        for: "00:30:00"
    conditions:
      - condition: state
        entity_id: schedule.depot_open_hours
        state: "off"
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.depot_roller_door_1
            state: "on"
          - condition: state
            entity_id: binary_sensor.depot_roller_door_2
            state: "on"
          - condition: state
            entity_id: binary_sensor.depot_gate
            state: "on"
    actions:
      - action: notify.notify
        data:
          title: Depot left open
          message: >
            Open after hours:
            {{ ['Roller door 1' if is_state('binary_sensor.depot_roller_door_1','on'),
                'Roller door 2' if is_state('binary_sensor.depot_roller_door_2','on'),
                'Gate' if is_state('binary_sensor.depot_gate','on')] | select | join(', ') }}

  - id: depot_alarm_not_armed
    alias: Depot - alarm not armed 45 min after close
    triggers:
      - trigger: state
        entity_id: schedule.depot_open_hours
        to: "off"
        for: "00:45:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.depot_alarm_disarmed
        state: "on"            # disarmed
    actions:
      - action: notify.notify
        data:
          title: Depot alarm not armed
          message: The depot closed 45 minutes ago and the alarm isn't armed.

  - id: depot_io_offline_alert
    alias: Depot - IO offline
    triggers:
      - trigger: state
        entity_id: binary_sensor.depot_io_online
        to: "off"
        for: "00:02:00"
    actions:
      - action: notify.notify
        data:
          title: Depot I/O offline
          message: HA can't reach the depot I/O. Yard lights fall back to ON, A/C to OFF.
